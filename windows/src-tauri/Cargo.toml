[package]
name = "codeburn-menubar"
version = "0.9.25"
description = "CodeBurn menubar (tray) app for Windows and Linux"
authors = ["AgentSeal"]
edition = "2021"
rust-version = "1.80"

[lib]
name = "codeburn_menubar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "rt-multi-thread", "macros", "time", "sync"] }
thiserror = "1"
anyhow = "1"
dirs = "5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
fontdue = "0.9"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Dwm", "Win32_Security_Cryptography", "Win32_System_Com", "Win32_System_Console", "Win32_System_Power", "Win32_System_RemoteDesktop", "Win32_System_SystemInformation", "Win32_System_SystemServices", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_System_StationsAndDesktops", "Win32_Storage_Packaging_Appx", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = "0.3"
png = "0.17"

[features]
default = ["custom-protocol"]
# This feature is used for production builds or when a dev server is not specified. Don't
# change it unless you know what you're doing.
custom-protocol = ["tauri/custom-protocol"]
