name: Windows Menubar CI

# The Windows menubar (windows/) is a Tauri app: a React frontend plus a Rust binary whose
# interesting code is `#[cfg(windows)]` and therefore only ever compiled on a Windows runner.
# ubuntu-latest is in the matrix because the same crate has to stay clean on the ksni/Linux
# paths and because contributors develop it on non-Windows machines.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/windows-menubar-ci.yml
      - windows/**
  pull_request:
    paths:
      - .github/workflows/windows-menubar-ci.yml
      - windows/**

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v7

      # webkit2gtk + libayatana are what the Tauri and ksni crates link against; without
      # them the Linux leg cannot even typecheck the Rust side.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            libgtk-3-dev \
            build-essential

      - uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows/src-tauri

      - name: Install dependencies
        working-directory: windows
        run: npm ci

      # The Rust suite's cross-process lock test spawns a real Node process beside the
      # Rust one, so both hammer the same settings file (dock.rs,
      # `concurrent_node_and_rust_patches_to_the_dock_file_both_survive`). The worker is
      # TypeScript run through tsx, which lives in the repo root's devDependencies and is
      # not installed by `npm ci` inside windows/. Without it the worker exits 1 and the
      # test fails, which is what it did rather than skipping.
      - name: Install the repo-root tools the Rust tests spawn
        run: npm ci --no-audit --no-fund

      - name: Typecheck frontend
        working-directory: windows
        run: npx tsc --noEmit

      - name: Clippy
        working-directory: windows/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust tests
        working-directory: windows/src-tauri
        run: cargo test

      # Release-profile compile of the real Windows binary. `--no-bundle` skips the WiX
      # download and MSI packaging, which belong to the release workflow, not to every PR.
      - name: Release build smoke
        if: runner.os == 'Windows'
        working-directory: windows
        run: npm run tauri build -- --no-bundle
