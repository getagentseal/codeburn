name: Release Windows Menubar

# Triggers on a `windows-v*` tag push (e.g. `git tag windows-v0.9.20 && git push origin
# windows-v0.9.20`), or manually via the Actions tab. Mirrors release-menubar.yml, which
# does the same job for the macOS menubar under the `mac-v*` tags. The produced `.msi` has no
# Authenticode signature, so SmartScreen prompts on first run; the tray's one-click updater
# instead checks the minisign signature written into windows-latest.json on update-feeds.
on:
  push:
    tags:
      - 'windows-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label for the bundle (e.g. v0.9.20 or dev-preview)'
        required: true
        default: 'dev-preview'

permissions:
  contents: write  # Needed to create the release + upload assets.

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve version label
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/windows-v* ]]; then
            echo "value=${GITHUB_REF#refs/tags/windows-}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows/src-tauri

      - name: Install dependencies
        working-directory: windows
        run: npm ci

      # Without the updater key the MSI ships unsigned for the updater and the feed is left alone.
      - name: Build MSI bundle
        working-directory: windows
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            npm run tauri build
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set; building without an updater signature"
            npm run tauri build -- --no-sign
          fi

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          find windows/src-tauri/target/release/bundle -type f -name '*.msi' \
            -exec cp -v {} release-artifacts/ \;
          (cd release-artifacts && for f in *.msi; do sha256sum "$f" > "$f.sha256"; done)
          ls -la release-artifacts

      - name: Upload artifact (for manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v6
        with:
          name: CodeBurnMenubar-Windows-${{ steps.version.outputs.value }}
          path: release-artifacts/*
          if-no-files-found: error

      - name: Create / update GitHub Release
        if: startsWith(github.ref, 'refs/tags/windows-v')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Windows Menubar ${{ steps.version.outputs.value }}
          body: |
            Download the `.msi` below and run it. The tray app reads everything through the
            CodeBurn CLI, so install that first:

            ```
            npm install -g codeburn
            ```

            Requires codeburn 0.9.9 or newer and the WebView2 Runtime (preinstalled on
            Windows 11 and recent Windows 10 updates; installed on demand otherwise).

            The bundle is unsigned, so Windows SmartScreen warns on first run: click
            "More info", then "Run anyway". Signing is planned.

            This `.msi` is a developer preview. The recommended install is the Microsoft
            Store (https://apps.microsoft.com/detail/9P0R4ZL5XMB8), which is signed and
            updates itself. Previews built with the updater key install newer previews from
            the tray in one click, after checking their signature. Older previews link to the
            release instead: take it by re-running `codeburn menubar --force` or downloading
            the new `.msi` here.
          files: release-artifacts/*
          fail_on_unmatched_files: true

      # Last: point the tray's updater at the release, once its MSI is live on it.
      - name: Publish tray update feed
        if: startsWith(github.ref, 'refs/tags/windows-v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#windows-v}"
          msi="CodeBurn.Menubar_${version}_x64_en-US.msi"
          gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fqx "$msi"
          sig=$(find windows/src-tauri/target/release/bundle/msi -name "*_${version}_x64_en-US.msi.sig" | head -1)
          if [ -z "$sig" ]; then
            echo "::warning::no updater signature for $msi; update-feeds/windows-latest.json not changed"
            exit 0
          fi
          VERSION="$version" MSI="$msi" SIG="$sig" node -e '
            const fs = require("fs")
            const { VERSION, MSI, SIG } = process.env
            fs.writeFileSync("windows-latest.json", JSON.stringify({
              version: VERSION,
              pub_date: new Date().toISOString(),
              platforms: {
                "windows-x86_64": {
                  signature: fs.readFileSync(SIG, "utf8").trim(),
                  url: `https://github.com/getagentseal/codeburn/releases/download/windows-v${VERSION}/${MSI}`,
                },
              },
            }, null, 2))'
          gh release view update-feeds -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create update-feeds -R "$GITHUB_REPOSITORY" --prerelease --latest=false \
              --title "Update feeds" --notes "Update metadata for the apps. Not a release to download."
          gh release upload update-feeds -R "$GITHUB_REPOSITORY" windows-latest.json --clobber
