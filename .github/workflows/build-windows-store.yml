name: Build Windows Store package

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/build-windows-store.yml
      - app/**
      - src/**
      # The Store package ships the tray exe, so a tray change must rebuild it.
      - windows/**
      - package.json
      - package-lock.json
  # A desktop release tag builds the Store package beside the NSIS installer, so both
  # artifacts for a version come from one commit.
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: read

jobs:
  appx:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.15.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
            windows/package-lock.json

      - name: Install CLI dependencies
        run: npm ci

      - name: Install desktop dependencies
        run: npm ci --prefix app

      # The Store package ships the tray exe: stage-menubar.mjs takes it from
      # windows/src-tauri/target/release, so no MSI bundle is needed here.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: windows/src-tauri

      - name: Install tray dependencies
        working-directory: windows
        run: npm ci

      - name: Build tray app
        working-directory: windows
        shell: bash
        run: npm run tauri build -- --no-bundle --no-sign

      - name: Build Microsoft Store package
        run: npm --prefix app run package:store

      - name: Upload Store package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: CodeBurn-Microsoft-Store
          path: app/release/CodeBurn-Store-*.appx
          if-no-files-found: error
          retention-days: 14
