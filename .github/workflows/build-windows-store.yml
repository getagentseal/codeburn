name: Build Windows Store package

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/build-windows-store.yml
      - app/**
      - src/**
      # The Store package ships the tray exe, so a tray change must rebuild it.
      - windows/**
      - package.json
      - package-lock.json
  # A desktop release tag builds the Store package beside the NSIS installer, so both
  # artifacts for a version come from one commit.
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: read

jobs:
  appx:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
            windows/package-lock.json

      - name: Install CLI dependencies
        run: npm ci

      - name: Install desktop dependencies
        run: npm ci --prefix app

      # The Store package ships the tray exe: stage-menubar.mjs takes it from
      # windows/src-tauri/target/release, so no MSI bundle is needed here.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows/src-tauri

      - name: Install tray dependencies
        working-directory: windows
        run: npm ci

      - name: Build tray app
        working-directory: windows
        run: npm run tauri build -- --no-bundle

      - name: Build Microsoft Store package
        run: npm --prefix app run package:store

      - name: Upload Store package
        uses: actions/upload-artifact@v6
        with:
          name: CodeBurn-Microsoft-Store
          path: app/release/CodeBurn-Store-*.appx
          if-no-files-found: error
          retention-days: 14
