name: Feature request
description: Propose a change or a new capability.
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem, in your words
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What you tried
      description: Existing commands, flags, or workarounds you already tried.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
