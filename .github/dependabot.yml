version: 2
# The Tauri CLI fails the build when the npm packages and the crates differ in minor version, so they update together.
multi-ecosystem-groups:
  windows-menubar:
    schedule:
      interval: monthly
      day: monday
    commit-message:
      prefix: "chore(deps)"
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      day: monday
    open-pull-requests-limit: 2
    labels:
      - dependencies
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: monthly
      day: monday
    open-pull-requests-limit: 2
    labels:
      - dependencies
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /dash
    schedule:
      interval: monthly
      day: monday
    open-pull-requests-limit: 2
    labels:
      - dependencies
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /windows
    open-pull-requests-limit: 2
    labels: [dependencies]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    patterns: ["*"]
    multi-ecosystem-group: windows-menubar

  - package-ecosystem: cargo
    directory: /windows/src-tauri
    open-pull-requests-limit: 2
    labels: [dependencies]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    patterns: ["*"]
    multi-ecosystem-group: windows-menubar

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      day: monday
    open-pull-requests-limit: 2
    labels:
      - dependencies
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
