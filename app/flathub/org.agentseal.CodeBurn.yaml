# Flathub manifest for CodeBurn Desktop. Repacks the published Linux deb from
# GitHub Releases (the same artifact shipped everywhere else) with the Electron
# baseapp + zypak. Update the url/sha256 pair on each desktop release.
app-id: org.agentseal.CodeBurn
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '24.08'
command: codeburn-run
separate-locales: false

finish-args:
  # CodeBurn only ever READS: session logs in dot-directories all over the home
  # dir (~/.claude, ~/.codex, ~/.cursor, ... 45 providers and counting), and the
  # user's own project directories, which git attribution, CLAUDE.md discovery
  # and per-project MCP config all need. Everything is parsed locally; nothing
  # is uploaded.
  #
  # So the grant is the whole home, read-only. Enumerating provider directories
  # instead was tried and rejected: it cannot cover project directories at all
  # (they are arbitrary paths), and it silently drops any provider whose root is
  # not on the list -- ~/.kimi-code, ~/.clawdbot, ~/.local/share/devin/cli and
  # the multi-account Claude roots are all real examples. A missing grant fails
  # as ENOENT, which is indistinguishable from "tool not installed".
  - --filesystem=home:ro
  # The two exceptions, both write paths CodeBurn owns:
  #   settings, act journal, sharing store, sync credentials
  - --filesystem=~/.config/codeburn:create
  #   `codeburn export` needs somewhere real to land; under home:ro it would
  #   write to the sandbox tmpfs and report success.
  - --filesystem=xdg-download:create
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --device=dri
  # Release check against GitHub and opening PR/session links in the browser.
  - --share=network
  - --talk-name=org.freedesktop.portal.Desktop

modules:
  - name: codeburn
    buildsystem: simple
    build-commands:
      - ar x codeburn-desktop.deb
      - tar -xf data.tar.*
      - cp -r opt/CodeBurn /app/codeburn
      - install -Dm755 codeburn-run /app/bin/codeburn-run
      - install -Dm644 org.agentseal.CodeBurn.desktop /app/share/applications/org.agentseal.CodeBurn.desktop
      - install -Dm644 org.agentseal.CodeBurn.metainfo.xml /app/share/metainfo/org.agentseal.CodeBurn.metainfo.xml
      - |
        for size in 16 32 48 64 128 256 512; do
          icon=usr/share/icons/hicolor/${size}x${size}/apps/codeburn.png
          if [ -f "$icon" ]; then
            install -Dm644 "$icon" /app/share/icons/hicolor/${size}x${size}/apps/org.agentseal.CodeBurn.png
          fi
        done
    sources:
      - type: file
        url: https://github.com/getagentseal/codeburn/releases/download/desktop-v0.9.20/codeburn-desktop_0.9.20_amd64.deb
        sha256: bf875a11aef90853bee3891ece965b98a7ddcc5331d98dfd113b72c80e8598ca
        dest-filename: codeburn-desktop.deb
        only-arches: [x86_64]
      - type: script
        dest-filename: codeburn-run
        commands:
          # $HOME is not redirected inside the sandbox, so CodeBurn's default
          # ~/.cache/codeburn lands on the tmpfs and every launch re-fetches the
          # LiteLLM table and cold-parses. Same story for OpenCode, which
          # resolves through XDG_DATA_HOME. Both are filled in only when the
          # user has not set them: `:+` rather than `+` because getCodeburnCacheDir
          # and getDataDir both treat an empty value as unset, so an empty
          # variable would otherwise reintroduce exactly this bug. XDG_CACHE_HOME
          # carries its own `:-` default so a launch that unsets it cannot turn
          # the cache dir into the literal "/codeburn".
          - |
            if [ -z "${CODEBURN_CACHE_DIR:+x}" ]; then
              export CODEBURN_CACHE_DIR="${XDG_CACHE_HOME:-$HOME/.cache}/codeburn"
            fi
          - |
            if [ -z "${OPENCODE_DATA_DIR:+x}" ]; then
              export OPENCODE_DATA_DIR="${HOME}/.local/share/opencode"
            fi
          - exec zypak-wrapper /app/codeburn/codeburn "$@"
      - type: file
        path: org.agentseal.CodeBurn.desktop
      - type: file
        path: org.agentseal.CodeBurn.metainfo.xml
