<!doctype html>
<meta charset="utf-8">
<title>CodeBurn hero banner</title>
<link rel="stylesheet" href="base.css">
<style>
  body { width: 1280px; height: 440px; display: grid; place-items: center; }
  .wrap { text-align: center; }
  .mark { width: 88px; height: 88px; border-radius: 18px; display: block; margin: 0 auto 34px; }
  h1 {
    margin: 0; font-size: 78px; font-weight: 620; letter-spacing: -0.035em; line-height: 1;
  }
  h1 .b { color: var(--accent); }
  p { margin: 22px 0 0; font-size: 25px; font-weight: 380; color: var(--muted); letter-spacing: -0.012em; }
  .rule { width: 52px; height: 1px; background: var(--line); margin: 38px auto 0; }
</style>
<div class="wrap">
  <img class="mark" src="../../logo.png" alt="">
  <h1>Code<span class="b">Burn</span></h1>
  <p>See where your AI coding money goes.</p>
  <div class="rule"></div>
</div>
