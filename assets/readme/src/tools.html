<!doctype html>
<meta charset="utf-8">
<title>Supported tools grid</title>
<link rel="stylesheet" href="base.css">
<style>
  body { width: 1048px; padding: 40px 34px 44px; background: var(--ground); }
  .grid { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
  .tile {
    width: 112px; height: 74px; border-radius: 12px; background: #FFFFFF;
    border: 1px solid var(--line); display: grid; place-items: center; padding: 10px;
  }
  html[data-theme='dark'] .tile { background: #EDECEA; border-color: #2A2C31; }
  .tile img { max-width: 84px; max-height: 30px; }
  .more {
    width: 112px; height: 74px; border-radius: 12px; border: 1px dashed var(--line);
    display: grid; place-items: center; font-size: 13px; color: var(--faint); text-align: center; line-height: 1.3;
  }
</style>
<div class="grid" id="g"></div>
<script>
  const tools = [
    ['claude.jpg','Claude Code'],['codex.png','Codex'],['cursor.jpg','Cursor'],
    ['copilot.jpg','GitHub Copilot'],['gemini.png','Gemini CLI'],['antigravity.png','Antigravity'],['grok.png','Grok'],
    ['qwen.png','Qwen'],['kimi.svg','Kimi Code'],['zcode.jpg','ZCode'],['codewhale.svg','CodeWhale'],
    ['mistral-vibe.svg','Mistral Vibe'],['devin.png','Devin'],['droid.png','Droid'],['cline.svg','Cline'],
    ['roo-code.png','Roo Code'],['kilo-code.png','KiloCode'],['opencode.png','OpenCode'],['openclaw.jpg','OpenClaw'],
    ['goose.png','Goose'],['crush.png','Crush'],['warp.jpg','Warp'],['zed.jpg','Zed'],
    ['kiro.png','Kiro'],['ibm-bob.svg','IBM Bob'],['forge.png','Forge'],['mux.png','Mux'],
    ['pi.png','Pi'],['omp.svg','OMP'],['hermes.png','Hermes Agent'],['zerostack.png','Zerostack'],
    ['vercel-gateway.png','Vercel AI Gateway'],
  ]
  document.getElementById('g').innerHTML =
    tools.map(([f, n]) => `<div class="tile"><img src="../../providers/${f}" alt="${n}"></div>`).join('')
</script>
